name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the real floor: the code uses PEP 604 unions (X | None).
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # The suite never touches the network. If it starts doing so, it
        # will fail here rather than passing locally against live
        # registries and hiding a dependency on them.
        run: python -m unittest discover -s tests -v

      - name: Lint (ruff)
        # Blocking. ruff is configured in pyproject.toml.
        run: |
          pip install "ruff>=0.6"
          ruff check .

      - name: Type check (mypy)
        # Advisory. The project shipped 359 tests and no type checking at
        # all; the first pass surfaced nine findings, now fixed. Kept
        # non-blocking so a new finding surfaces as a signal rather than
        # blocking unrelated work. Flip continue-on-error to false once
        # the count reaches zero and stays there.
        continue-on-error: true
        run: |
          pip install "mypy>=1.11"
          mypy

      - name: Verify the package installs and its scripts work
        # Packaging is the one thing a test suite cannot check for itself.
        run: |
          pip install .
          signalpost --check > /dev/null || true
          signalpost-batch --help > /dev/null
          echo "console scripts OK"

      - name: Verify the package imports without optional extras
        # The LLM path must stay genuinely optional.
        run: |
          python -c "
          from src import agent, brreg, roles, financials, identity, sources
          from src import explain, extract, page, cache, conflicts, crawl
          from src.llm import is_available
          assert is_available() is False, 'anthropic should not be installed'
          print('core imports OK, LLM correctly absent')
          "

      - name: Verify encoding integrity
        # Norwegian characters are the whole point; a regression here is
        # invisible in review but destroys the output. .gitattributes
        # pins LF so this describes every contributor's working tree,
        # not only the Linux checkout CI happens to use.
        run: |
          python -c "
          from pathlib import Path
          import ast
          for f in list(Path('src').glob('*.py')) + list(Path('tests').glob('*.py')):
              raw = f.read_bytes()
              assert not raw.startswith(b'\xef\xbb\xbf'), f'{f} has a BOM'
              assert b'\r' not in raw, f'{f} has CR line endings'
              text = raw.decode('utf-8')
              assert '\ufffd' not in text, f'{f} contains a replacement char'
              ast.parse(text)
          print('encoding clean')
          "

      - name: Verify the CLI parses and reports errors correctly
        run: |
          python -m src.agent --help > /dev/null
          # A malformed number must be rejected before any network call.
          if python -m src.agent 12345678; then
            echo "expected exit code 2 for an invalid organization number"
            exit 1
          fi
          python -c "
          from src.__main__ import _force_utf8_output
          _force_utf8_output()
          import sys
          assert sys.stdout.encoding.lower().replace('-','') == 'utf8'
          print('CLI enforces UTF-8 output')
          "

      - name: Verify the two entry points agree
        # A README claim about shared flags is not a test. This is.
        run: python -m unittest tests.test_cli.ParityTests -v